name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Locate project
        id: p
        run: echo "dir=$(dirname "$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)")" >> "$GITHUB_OUTPUT"
      - run: gradle :app:assembleDebug --no-daemon --stacktrace
        working-directory: ${{ steps.p.outputs.dir }}
      - uses: actions/upload-artifact@v4
        with:
          name: SafeDrop-apk
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/*.apk
